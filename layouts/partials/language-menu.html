{{- /* Root override of the theme partial (hugo-theme-terminal).
       `.Language.LanguageName` was deprecated in Hugo v0.158.0 in favour of `.Language.Label`. */ -}}
<ul class="menu menu--desktop menu--language-selector">
  <li class="menu__trigger">{{ .Language.Label }}&nbsp;▾</li>
  <li>
    <ul class="menu__dropdown">
      {{ range $.Site.Home.AllTranslations }}
        <li><a href="{{ .Permalink }}">{{ .Language.Label }}</a></li>
      {{ end }}
    </ul>
  </li>
</ul>
